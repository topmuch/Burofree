version: '3.8'

# ═══════════════════════════════════════════════════════════════════
# Burofree - Docker Compose for Coolify
# ═══════════════════════════════════════════════════════════════════
# Usage in Coolify:
#   1. Add this as a "Docker Compose" service
#   2. Set environment variables in Coolify's Environment tab
#   3. Deploy
#
# Required env vars (minimum):
#   DB_PASSWORD, NEXTAUTH_SECRET, ENCRYPTION_KEY
# ═══════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      args:
        - DATABASE_URL=postgresql://burozen:${DB_PASSWORD}@db:5432/burozen
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://burozen:${DB_PASSWORD}@db:5432/burozen
      - DIRECT_URL=postgresql://burozen:${DB_PASSWORD}@db:5432/burozen
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=https://${DOMAIN}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_GOOGLE_CONFIGURED=${NEXT_PUBLIC_GOOGLE_CONFIGURED:-false}
      - NEXT_PUBLIC_MICROSOFT_CONFIGURED=${NEXT_PUBLIC_MICROSOFT_CONFIGURED:-false}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: burozen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: burozen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burozen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

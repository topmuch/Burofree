services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/burofree.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-chars-minimum!!}
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - burofree_data:/app/data
      - burofree_uploads:/app/public/uploads
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  burofree_data:
  burofree_uploads:
  redis_data:
